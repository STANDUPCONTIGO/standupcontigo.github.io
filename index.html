<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Catálogo STAND UP</title>

<style>
/* Layout: app de una columna; fondo rojo de marca dominante, tarjetas de vidrio oscuro translúcido, botones principales en blanco hueso. */
:root{
  --red:#B3261E; --red-hi:#CF3A2F; --red-lo:#7E1912; --red-deep:#5E120D;
  --bone:#EDE6D8; --muted:rgba(237,230,216,.8); --faint:rgba(237,230,216,.55);
  --card:rgba(28,28,28,.24); --card2:rgba(28,28,28,.38); --line:rgba(237,230,216,.24);
  --char:#1C1C1C; --wa:#1F8F55;
  --title:"Oswald","Arial Narrow",Impact,sans-serif;
  --accent:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --logo:"Yellowtail","Brush Script MT",cursive;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{background:var(--red)}
body{margin:0;min-height:100vh;color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;
  background:
    radial-gradient(90% 55% at 50% 0%, var(--red-hi), transparent 70%),
    radial-gradient(120% 70% at 50% 110%, var(--red-lo), transparent 70%),
    var(--red);
  background-attachment:fixed}
img{max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(94,18,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{border:1.5px solid rgba(255,255,255,.85);background:var(--red);color:#fff;border-radius:10px;padding:2px 14px 6px;font-family:var(--logo);font-size:28px;line-height:1.1}
.motto{font-family:var(--title);font-weight:500;letter-spacing:.22em;font-size:12px;color:var(--muted);text-transform:uppercase}
.cartbtn{margin-left:auto;border:0;background:var(--bone);color:var(--red-lo);border-radius:999px;padding:8px 14px;font-family:var(--title);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.cartbtn b{background:var(--red);color:#fff;border-radius:999px;min-width:22px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums}

.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:22px}

/* Rótulo: línea pequeña en mayúsculas + línea grande en cursiva, barrita blanco hueso */
.label{display:flex;gap:12px;align-items:stretch}
.label::before{content:"";width:4px;border-radius:4px;background:var(--bone);flex:none}
.label small{display:block;font-family:var(--title);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.label h1{margin:2px 0 0;font-family:var(--accent);font-style:italic;font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1.05;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:60ch}
h2{margin:0;font-family:var(--title);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:12px}

.trail{display:flex;flex-wrap:wrap;gap:6px}
.trail button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.trail .back{background:var(--bone);color:var(--red-lo);border-color:var(--bone)}

.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* Inicio */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.hero button{position:relative;overflow:hidden;text-align:left;padding:26px 22px 22px;display:flex;flex-direction:column;gap:8px;min-height:170px;justify-content:flex-end;min-width:0}
.hero button .k{font-family:var(--title);font-weight:500;letter-spacing:.2em;font-size:12px;color:var(--muted);text-transform:uppercase}
.hero button strong{font-family:var(--title);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1}
.hero button em{font-family:var(--accent);font-weight:500;font-size:20px}
.hero button.hot{background:var(--bone);color:var(--red-lo);border-color:var(--bone);box-shadow:0 16px 40px rgba(60,10,6,.35)}
.hero button.hot .k{color:var(--red)}
.hero button .ghost{position:absolute;right:-6px;top:-14px;font-family:var(--title);font-weight:700;font-size:110px;line-height:1;color:rgba(237,230,216,.08);text-transform:uppercase;pointer-events:none}
.hero button.hot .ghost{color:rgba(179,38,30,.08)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perks span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}

/* Listas */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.row{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:600;min-width:0}
.row:hover:not([disabled]){background:var(--card2);border-color:var(--bone)}
.row small{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
.row[disabled]{cursor:default;background:transparent;border-style:dashed;color:var(--faint)}
.row[disabled] small{color:var(--faint)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 button{padding:28px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.big2 strong{font-family:var(--title);font-weight:700;text-transform:uppercase;font-size:28px;line-height:1}
.big2 em{font-family:var(--accent);color:var(--muted);font-size:16px}
.big2 button:hover{border-color:var(--bone)}
.garments{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.garments button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.garments button:hover{background:var(--bone);color:var(--red-lo);border-color:var(--bone)}
.garments b{font-family:var(--title);font-weight:600;text-transform:uppercase;font-size:20px;letter-spacing:.02em;line-height:1.1}
.garments span{font-size:12px;color:inherit;opacity:.75}

.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:60px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-family:var(--title);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.sizes button:hover{background:var(--bone);color:var(--red-lo);border-color:var(--bone)}

/* Tarjetas de prenda */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--bone)}
.ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:radial-gradient(70% 80% at 50% 0%, rgba(237,230,216,.18), transparent 70%),linear-gradient(180deg,var(--red-lo),var(--red-deep))}
.ph span{font-family:var(--accent);font-style:italic;font-weight:700;font-size:54px;color:var(--bone)}
.ph i{position:absolute;left:10px;top:9px;font-style:normal;font-family:var(--title);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.card .tx{padding:10px 12px 13px;display:flex;flex-direction:column;gap:3px}
.card .nm{font-family:var(--title);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1.15}
.price{font-family:var(--title);font-weight:600;font-variant-numeric:tabular-nums;font-size:18px}
.noprice{font-size:12px;color:var(--muted);font-weight:600}

/* Detalle */
.detail{overflow:hidden}
.detail .ph{aspect-ratio:16/9}
.detail .ph span{font-size:96px}
.detail .tx{padding:20px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.facts div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.facts dt{font-family:var(--title);letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.bigprice{font-family:var(--title);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bigprice small{font-size:20px;color:var(--muted);font-weight:500;margin-right:4px}
.note{border:1px dashed rgba(237,230,216,.45);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.measures{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.measures td{padding:9px 0;border-bottom:1px solid var(--line)}
.measures td:last-child{text-align:right;font-family:var(--title);font-weight:600;font-size:18px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.qty output{min-width:28px;text-align:center;font-family:var(--title);font-size:22px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border-radius:12px;padding:14px 18px;font-family:var(--title);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;border:1px solid var(--line);background:var(--card);text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.btn.primary{background:var(--bone);border-color:var(--bone);color:var(--red-lo);box-shadow:0 10px 26px rgba(60,10,6,.3)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.full{flex:1 1 220px}
.box .btn.full,.qr .btn.full,.solo .btn.full{flex:none;width:100%;min-height:54px}
.toast{font-weight:600;color:var(--bone);font-size:14px;min-height:1.4em}

/* Pedido y pago */
.line{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.line .g{flex:1;min-width:0}
.line .g b{display:block;font-family:var(--title);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.line .g span{font-size:13px;color:var(--muted)}
.line .rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px}
.total span:first-child{font-family:var(--title);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.box,.solo{padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:rgba(40,8,6,.35);border-radius:12px;padding:12px 14px;width:100%}
.field input::placeholder{color:var(--faint)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 10px;font-family:var(--title);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--bone);color:var(--red-lo);border-color:var(--bone)}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qrcard{background:#fff;border-radius:16px;padding:14px 14px 10px;width:min(280px,100%);display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--char)}
.qrcard svg{width:100%;height:auto;display:block}
.qrcard small{font-family:var(--title);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#555}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}
.foot{max-width:780px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}
.foot b{color:var(--bone);font-weight:600}
@media (prefers-reduced-motion:no-preference){ .wrap>*{animation:up .32s ease both} @keyframes up{from{transform:translateY(8px)}to{transform:none}} }
@media (max-width:420px){ .motto{display:none} .facts{grid-template-columns:1fr 1fr} }
</style></head><body>

<script>
// Contacto y pago
const WHATSAPP = '59171520501';
const QR_TEXT = 'PfI95Zk0NjsJmr6+lzf/jTZfMzyJW+fsHJYNMHYSZcxqvEI1585zgOoqPDneCXsZM9KIaZbS7fvrrYhfS9RD4PtFxqNtSF2HxjDlz84XTWN/HqfNtnH6Baa4qVL2CZj3kahf5dDIJ1p+EE+Gn3Y7MnLCjg5d2lvSaWAo4WG87yB8olnuXpsBcUbUwwsk4MVxT/sq8f1WjRXL9HetdFw4OLIVdvkGYo+oJ1RuXCh9AVXKeZ6N9KItbcAef4gBPYi2S7XE2+qtqSSer3GKOecDrKfQUWPwPIjE9y/nrAuCO+Y7YQ9Ld/fZRZiCHr4633iYUaXq72nBUiLjuSa/Tb4BuQ==|36D40CC72CC80CFA2B6DFEAB'; // QR de cobro BNB

// Medidas en centímetros. Cada fila: [prenda, talla, colegio o '*', {medida: valor}]
const MEDIDAS = [];

const SCHOOLS = [['sc','San Calixto'],['cic','Inglés Católico'],['uee','Unidad Educativa del Ejército'],['add','Amor de Dios'],['si','San Ignacio'],['as','American School'],['cds','Colegio del Sur'],['mp','Macario Pinilla'],['sa','Santa Ana'],['idef','IDEF Bancario'],['nav','Naval'],['rg','Rosa Gattorno'],['ls','La Salle'],['mc','Unidad Educativa Medina Celi'],['lp','Los Pinos']];
const SNAME = Object.fromEntries(SCHOOLS);
const SCODE = {sc:'SAN CALIXTO',cic:'CIC',uee:'UEE',add:'AMOR DE DIOS',mp:'MACARIO PINILLA',nav:'NAVAL',ls:'LA SALLE'};
const GNAME = {V:'Varón', M:'Mujer'};
const NAMES = {PANTALONES:'Pantalón'};
const ACC = new Set(['MEDIAS','PANTY','CORBATA','GORRA','MORRAL','SOMBRERO']);
const ORDER = ['CHOMPA','CAMISA','BLUSA','PANTALONES','FALDA','YAMPER','CHALECO','CHAQUETA','CHAMARRA','CANGURO','BUZO','DEPORTIVO','POLERA','SHORT','CALZA','CORBATA','MEDIAS','PANTY','GORRA','SOMBRERO','MORRAL'];
const SIZE_GROUPS = [
  ['Niño y niña', ['4','6','8','10','12','14','16']],
  ['Juvenil y adulto', ['XS','S','M','L','XL','XXL']],
  ['Cintura', ['34','36','38','40','42','44','46','48','50']],
  ['Cuello de camisa', ['14.5','15','15.5','16','16.5','17']],
  ['Medias y panty', ['4-6','6-8','8-10','10-12','MAYOR','MAYOR 38-42']],
  ['Otras', ['CON LIGA','LARGAS','PEQUEÑO','GRANDE']]
];
const SIZE_ORDER = SIZE_GROUPS.flatMap(g => g[1]);
const CASUAL = {
  V: [['Parte de arriba',['Chaqueta','Chamarra','Chaleco']],['Interior',['Polera','Polerón','Sudadera','Camisa']],['Parte inferior',['Pantalón']]],
  M: [['Parte de arriba',['Chaqueta','Chamarra','Chaleco']],['Interior',['Polera','Polerón','Sudadera','Blusa']],['Parte inferior',['Pantalón']]]
};
const CASUAL_SIZES = [['Niño y niña',['4','6','8','10','12','14','16']],['Juvenil y adulto',['S','M','L','XL','XXL']]];

const seen = {};
const DB = ITEMS.map(r => { const k = r[3]+'|'+r[1]+'|'+r[4]+'|'+r[2]; seen[k] = (seen[k]||0)+1;
  return {code:r[0], g:r[1], size:r[2], school:r[3], sex:r[4], price:r[5], k, n:seen[k]}; });
const BYCODE = Object.fromEntries(DB.map(i => [i.code, i]));
const COUNT = {}; DB.forEach(i => COUNT[i.school] = (COUNT[i.school]||0)+1);

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gname = g => NAMES[g] || g.charAt(0) + g.slice(1).toLowerCase();
const title = i => gname(i.g) + (seen[i.k] > 1 ? ' · modelo ' + i.n : '');
const money = p => 'Bs ' + p;
const rank = g => { const x = ORDER.indexOf(g); return x < 0 ? 99 : x; };
const srank = s => { const x = SIZE_ORDER.indexOf(s); return x < 0 ? 999 : x; };
const measuresFor = i => { const sc = SCODE[i.school];
  const hit = MEDIDAS.find(m => m[0] === i.g && m[1] === i.size && m[2] === sc) || MEDIDAS.find(m => m[0] === i.g && m[1] === i.size && m[2] === '*');
  return hit ? hit[3] : null; };
const go_ = p => "data-go='" + esc(JSON.stringify(p)) + "'";
const waLink = msg => 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);

let S = {view:'home', pay:'wa'};
let cart = [], buyer = '';
try { cart = (JSON.parse(localStorage.getItem('su-pedido')) || []).filter(l => BYCODE[l.code]); buyer = localStorage.getItem('su-nombre') || ''; } catch(e) {}
const save = () => { try { localStorage.setItem('su-pedido', JSON.stringify(cart)); localStorage.setItem('su-nombre', buyer); } catch(e) {} };

// Prendas del colegio y sexo elegidos (las unisex aparecen para los dos)
const pool = () => DB.filter(i => i.school === S.school && (i.sex === S.sex || i.sex === 'U'));
const app = document.getElementById('app');
function go(patch){ S = Object.assign({}, S, patch); render(); window.scrollTo(0,0); }

function trail(){
  if (S.view === 'home') return '';
  if (S.view === 'pay') return '<nav class="trail"><button class="back" ' + go_(S.prev || {view:'home'}) + '>← Seguir eligiendo</button></nav>';
  const t = [], add = (lb, p) => t.push('<button ' + go_(p) + '>' + esc(lb) + '</button>');
  const at = v => ['sex','schools','garments','sizes','items','item','cgarments','csizes','cresult'].indexOf(v);
  const now = at(S.view);
  add('Inicio', {view:'home'});
  add(S.type === 'uni' ? 'Uniformes' : 'Ropa casual', {view:'sex'});
  if (S.sex && now > 0) add(GNAME[S.sex], {view: S.type === 'uni' ? 'schools' : 'cgarments'});
  if (S.type === 'uni') {
    if (S.school && now > at('schools')) add(SNAME[S.school], {view:'garments'});
    if (S.g && now > at('garments')) add(gname(S.g), {view:'sizes'});
    if (S.size && now > at('sizes')) add('Talla ' + S.size, {view:'sizes'});
  } else {
    if (S.cg && now > at('cgarments')) add(S.cg, {view:'csizes'});
    if (S.size && now > at('csizes')) add('Talla ' + S.size, {view:'csizes'});
  }
  return '<nav class="trail" aria-label="Pasos">' + t.join('') + '</nav>';
}
const label = (small, big) => '<div class="label"><div><small>' + small + '</small><h1>' + big + '</h1></div></div>';
const ph = i => '<div class="ph" aria-hidden="true"><i>' + esc(SNAME[i.school]) + '</i><span>' + esc(gname(i.g).charAt(0)) + '</span></div>';
const sizeButtons = (sizes, patchFor) => {
  let h = '', rest = sizes.filter(s => !SIZE_ORDER.includes(s)), used = new Set();
  // En camisas, el 16 es talla de cuello: ese grupo va primero
  const groups = sizes.includes('15.5') ? [SIZE_GROUPS[3], ...SIZE_GROUPS.filter((g, x) => x !== 3)] : SIZE_GROUPS;
  groups.forEach(([lb, list]) => { const have = list.filter(s => sizes.includes(s) && !used.has(s)); have.forEach(s => used.add(s)); if (!have.length) return;
    h += '<div class="group"><h2>' + lb + '</h2><div class="sizes">' + have.map(s => '<button ' + go_(patchFor(s)) + '>' + esc(s) + '</button>').join('') + '</div></div>'; });
  if (rest.length) h += '<div class="group"><h2>Otras</h2><div class="sizes">' + rest.map(s => '<button ' + go_(patchFor(s)) + '>' + esc(s) + '</button>').join('') + '</div></div>';
  return h;
};

function card(i){
  return '<button class="card glass" ' + go_({view:'item', code:i.code, q:1}) + '>' + ph(i) + '<div class="tx">' +
    '<span class="nm">' + esc(title(i)) + '</span>' +
    (i.price != null ? '<span class="price">' + money(i.price) + '</span>' : '<span class="noprice">Precio por confirmar</span>') +
    '</div></button>';
}

function orderText(){
  let total = 0, pend = 0;
  const lines = cart.map(l => { const i = BYCODE[l.code]; const sub = i.price != null ? i.price * l.q : null;
    if (sub == null) pend++; else total += sub;
    return '• ' + l.q + ' x ' + title(i) + ' · talla ' + i.size + ' · ' + SNAME[i.school] + (sub != null ? ' · Bs ' + sub : ' · precio por confirmar'); });
  return {total, pend, text: 'Hola STAND UP, quiero hacer este pedido:\n' + lines.join('\n') +
    '\n\nTotal: Bs ' + total + (pend ? ' + ' + pend + ' prenda(s) con precio por confirmar' : '') +
    (buyer ? '\nA nombre de: ' + buyer : '')};
}

function drawQR(){
  const box = document.getElementById('qrsvg'); if (!box) return;
  try { const q = qrcode(0, 'M'); q.addData(QR_TEXT); q.make(); box.innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch(e) { box.innerHTML = '<p>No pudimos mostrar el QR. Pídelo por WhatsApp al 71520501.</p>'; }
}

const VIEWS = {
  home(){
    return label('Catálogo STAND UP', '¿Qué estás buscando?') +
      '<div class="hero">' +
      '<button class="glass hot" ' + go_({view:'sex', type:'uni', sex:null, school:null, g:null, size:null}) + '><span class="ghost">Cole</span><span class="k">' + Object.keys(COUNT).length + ' colegios</span><strong>Uniforme escolar</strong><em>elige colegio, prenda y talla</em></button>' +
      '<button class="glass" ' + go_({view:'sex', type:'cas', sex:null, cg:null, size:null}) + '><span class="ghost">Casual</span><span class="k">Para cada momento</span><strong>Ropa casual</strong><em>chamarras, poleras, pantalones</em></button></div>' +
      '<div class="perks"><span>Cambios flexibles</span><span>Bordados y arreglos</span><span>Envío a domicilio</span><span>Pagos con QR</span></div>';
  },
  sex(){
    const uni = S.type === 'uni';
    return label(uni ? 'Uniforme escolar' : 'Ropa casual', '¿Para quién es?') + '<div class="big2">' +
      ['V','M'].map(x => '<button class="glass" ' + go_(uni ? {view:'schools', sex:x, school:null, g:null, size:null} : {view:'cgarments', sex:x, cg:null, size:null}) + '><strong>' + GNAME[x] + '</strong><em>' +
        (uni ? (x === 'V' ? 'camisa, pantalón, chompa…' : 'blusa, falda, yamper…') : (x === 'V' ? 'para él' : 'para ella')) + '</em></button>').join('') + '</div>';
  },
  schools(){
    return label('Uniforme escolar · ' + GNAME[S.sex], '¿De qué colegio?') + '<div class="list">' + SCHOOLS.map(([k,n]) => COUNT[k]
      ? '<button class="row" ' + go_({view:'garments', school:k, g:null, size:null}) + '>' + esc(n) + '<small>Ver prendas</small></button>'
      : '<button class="row" disabled>' + esc(n) + '<small>Próximamente</small></button>').join('') + '</div>';
  },
  garments(){
    const p = pool(), by = {};
    p.forEach(i => { (by[i.g] = by[i.g] || new Set()).add(i.size); });
    const gs = Object.keys(by).sort((a,b) => rank(a) - rank(b));
    const btn = g => '<button ' + go_({view:'sizes', g, size:null}) + '><b>' + esc(gname(g)) + '</b><span>' + by[g].size + (by[g].size === 1 ? ' talla' : ' tallas') + '</span></button>';
    const main = gs.filter(g => !ACC.has(g)), acc = gs.filter(g => ACC.has(g));
    return label(SNAME[S.school] + ' · ' + GNAME[S.sex], '¿Qué prenda buscas?') +
      '<div class="garments">' + main.map(btn).join('') + '</div>' +
      (acc.length ? '<div class="group"><h2>Accesorios</h2><div class="garments">' + acc.map(btn).join('') + '</div></div>' : '');
  },
  sizes(){
    const sizes = [...new Set(pool().filter(i => i.g === S.g).map(i => i.size))].sort((a,b) => srank(a) - srank(b));
    return label(SNAME[S.school] + ' · ' + gname(S.g), '¿Qué talla necesitas?') + sizeButtons(sizes, s => ({pick:s}));
  },
  items(){
    const p = pool().filter(i => i.g === S.g && i.size === S.size).sort((a,b) => a.n - b.n);
    return label(SNAME[S.school] + ' · talla ' + esc(S.size), 'Elige el modelo') + '<div class="cards">' + p.map(card).join('') + '</div>';
  },
  item(){
    const i = BYCODE[S.code], m = measuresFor(i); S.q = S.q || 1;
    return '<article class="detail glass">' + ph(i) + '<div class="tx">' +
      label(SNAME[i.school], esc(title(i))) +
      '<dl class="facts"><div><dt>Talla</dt><dd>' + esc(i.size) + '</dd></div><div><dt>Para</dt><dd>' + ({V:'Varón',M:'Mujer',U:'Varón y mujer'}[i.sex]) + '</dd></div><div><dt>Colegio</dt><dd>' + esc(SNAME[i.school]) + '</dd></div></dl>' +
      (i.price != null ? '<div class="bigprice"><small>Bs</small>' + i.price + '</div>' : '<div class="note">El precio de esta prenda todavía no está cargado. Agrégala al pedido y te lo confirmamos por WhatsApp.</div>') +
      '<div class="group"><h2>Medidas</h2>' + (m
        ? '<table class="measures"><tbody>' + Object.entries(m).map(([k,v]) => '<tr><td>' + esc(k) + '</td><td>' + esc(v) + ' cm</td></tr>').join('') + '</tbody></table>'
        : '<div class="note">Estamos cargando las medidas de esta talla. Si tienes dudas, escríbenos y te las pasamos.</div>') + '</div>' +
      '<div class="qty"><span>Cantidad</span><button data-q="-1" aria-label="Quitar una">−</button><output id="qty">' + S.q + '</output><button data-q="1" aria-label="Agregar una">+</button></div>' +
      '<div class="actions"><button class="btn primary full" data-add="pay">Comprar</button><button class="btn full" data-add="stay">Agregar y seguir</button></div>' +
      '<div class="toast" id="toast" role="status"></div></div></article>';
  },
  cgarments(){
    return label('Ropa casual · ' + GNAME[S.sex], '¿Qué prenda buscas?') + CASUAL[S.sex].map(([lb, list]) =>
      '<div class="group"><h2>' + lb + '</h2><div class="garments">' + list.map(g => '<button ' + go_({view:'csizes', cg:g, size:null}) + '><b>' + esc(g) + '</b></button>').join('') + '</div></div>').join('');
  },
  csizes(){
    let h = label('Ropa casual · ' + esc(S.cg), '¿Qué talla necesitas?');
    CASUAL_SIZES.forEach(([lb, list]) => { h += '<div class="group"><h2>' + lb + '</h2><div class="sizes">' + list.map(s => '<button ' + go_({view:'cresult', size:s}) + '>' + s + '</button>').join('') + '</div></div>'; });
    return h;
  },
  cresult(){
    const msg = 'Hola STAND UP, busco ' + S.cg.toLowerCase() + ' (ropa casual) para ' + GNAME[S.sex].toLowerCase() + ', talla ' + S.size + '. ¿Qué modelos tienen?';
    return label('Ropa casual · ' + GNAME[S.sex] + ' · talla ' + esc(S.size), esc(S.cg)) +
      '<section class="glass solo"><p class="lead">Estamos subiendo la ropa casual al catálogo. Escríbenos y te mandamos fotos y precios de lo que tenemos en tu talla.</p>' +
      '<a class="btn wa full" target="_blank" rel="noopener" href="' + waLink(msg) + '">Preguntar por WhatsApp</a></section>';
  },
  pay(){
    if (!cart.length) return label('Mi pedido', 'Tu pedido está vacío') + '<div class="actions"><button class="btn primary" ' + go_({view:'home'}) + '>Ver el catálogo</button></div>';
    const o = orderText();
    const rows = cart.map((l, x) => { const i = BYCODE[l.code]; const sub = i.price != null ? i.price * l.q : null;
      return '<div class="line"><div class="g"><b>' + l.q + ' × ' + esc(title(i)) + '</b><span>' + esc(SNAME[i.school]) + ' · talla ' + esc(i.size) + '</span><br><button class="rm" data-rm="' + x + '">Quitar</button></div>' +
        (sub != null ? '<span class="price">' + money(sub) + '</span>' : '<span class="noprice">Por confirmar</span>') + '</div>'; }).join('');
    return label('Mi pedido', 'Revisa y paga') +
      '<section class="glass box"><div>' + rows + '<div class="total"><span>Total' + (o.pend ? ' sin las prendas por confirmar' : '') + '</span><span class="bigprice"><small>Bs</small>' + o.total + '</span></div></div></section>' +
      '<section class="glass box"><h2>¿Cómo quieres pagar?</h2>' +
      '<div class="tabs"><button data-pay="qr" aria-pressed="' + (S.pay === 'qr') + '">Pagar con QR</button><button data-pay="wa" aria-pressed="' + (S.pay === 'wa') + '">Por WhatsApp</button></div>' +
      '<div class="field"><label for="buyer">Tu nombre (opcional)</label><input id="buyer" autocomplete="name" placeholder="Ej. Mamá de Sofía" value="' + esc(buyer) + '"></div>' +
      (S.pay === 'qr'
        ? '<div class="qr"><div class="qrcard"><div id="qrsvg" style="width:100%"></div><small>BNB · Escanea y paga</small></div>' +
          '<p class="lead">' + (o.pend ? 'Algunas prendas no tienen precio todavía: escríbenos primero para confirmar el total.' : 'Escanea el QR desde la app de tu banco y paga <b>Bs ' + o.total + '</b>.') + ' Después envíanos el comprobante por WhatsApp con tu pedido.</p>' +
          '<a class="btn wa full" id="walink" target="_blank" rel="noopener" href="' + waLink(o.text + '\n\nYa pagué por QR, te envío el comprobante.') + '">Enviar comprobante por WhatsApp</a></div>'
        : '<p class="lead">Te abrimos WhatsApp con tu pedido ya escrito. Solo dale enviar y te respondemos con el total, el pago y la entrega.</p>' +
          '<a class="btn wa full" id="walink" target="_blank" rel="noopener" href="' + waLink(o.text) + '">Enviar pedido al 71520501</a>') +
      '</section><div class="actions"><button class="btn" id="clear">Vaciar pedido</button></div>';
  }
};

function render(){
  app.innerHTML = trail() + VIEWS[S.view]();
  document.getElementById('cartn').textContent = cart.reduce((a,l) => a + l.q, 0);
  drawQR();
}

document.addEventListener('input', e => {
  if (e.target.id !== 'buyer') return;
  buyer = e.target.value.slice(0, 60); save();
  const a = document.getElementById('walink'); if (!a) return;
  const t = orderText().text; a.href = waLink(S.pay === 'qr' ? t + '\n\nYa pagué por QR, te envío el comprobante.' : t);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.id === 'home') return go({view:'home'});
  if (b.id === 'cartbtn') return go({view:'pay', prev: S.view === 'pay' ? S.prev : Object.assign({}, S, {prev:null})});
  if (b.dataset.go) {
    const p = JSON.parse(b.dataset.go);
    if (p.pick) { // talla elegida: si hay un solo modelo, directo a la prenda
      const m = pool().filter(i => i.g === S.g && i.size === p.pick);
      return go(m.length === 1 ? {size:p.pick, view:'item', code:m[0].code, q:1} : {size:p.pick, view:'items'});
    }
    return go(p);
  }
  if (b.dataset.q) { S.q = Math.max(1, Math.min(99, S.q + Number(b.dataset.q))); document.getElementById('qty').textContent = S.q; return; }
  if (b.dataset.pay) { S.pay = b.dataset.pay; return render(); }
  if (b.dataset.add) {
    const l = cart.find(l => l.code === S.code); if (l) l.q += S.q; else cart.push({code:S.code, q:S.q}); save();
    if (b.dataset.add === 'pay') return go({view:'pay', prev:Object.assign({}, S, {view:'garments', prev:null})});
    render(); document.getElementById('toast').textContent = 'Agregado a tu pedido. Sigue eligiendo o toca Mi pedido.'; return;
  }
  if (b.dataset.rm) { cart.splice(Number(b.dataset.rm), 1); save(); return render(); }
  if (b.id === 'clear') { cart = []; save(); return render(); }
});
render();
</script>
</body></html>
