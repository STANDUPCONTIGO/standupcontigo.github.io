<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Yellowtail&display=swap">
<style>
/* Layout: una sola columna tipo app de celular; cabecera roja fija, rastro de pasos arriba y una pregunta por pantalla. */
:root{
  --bg:#FAF6F6; --surface:#FFFFFF; --ink:#1A1D38; --muted:#676B83; --line:#E9E1E3;
  --brand:#D41F2D; --brand-ink:#FFFFFF; --tint:#FCE9EB; --ok:#1F7A4D;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13141E; --surface:#1D1F2E; --ink:#F2EFF4; --muted:#A4A7BD; --line:#2F3247;
  --brand:#E23441; --brand-ink:#FFFFFF; --tint:#35202A; --ok:#5CC492; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13141E; --surface:#1D1F2E; --ink:#F2EFF4; --muted:#A4A7BD; --line:#2F3247;
  --brand:#E23441; --brand-ink:#FFFFFF; --tint:#35202A; --ok:#5CC492; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{background:none;border:0;padding:0;color:var(--brand-ink);text-align:left;display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--script);font-weight:400;font-size:30px}
.logo span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:2px}
.cartbtn{margin-left:auto;background:var(--brand-ink);color:var(--brand);border:0;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trail button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.trail .back{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.lead{color:var(--muted);margin:0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:10px}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.big button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.big button strong{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.big button span{color:var(--muted);font-size:15px}
.big button.hot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.big button.hot span{color:var(--brand-ink);opacity:.9}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:600;min-width:0}
.row small{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.row[disabled]{cursor:default;background:transparent;border-style:dashed;color:var(--muted)}

.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:58px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/3;background:var(--tint);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:44px;color:var(--brand)}
.card .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:700}
.card .mt{font-size:13px;color:var(--muted)}
.price{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.noprice{font-size:13px;color:var(--muted);font-weight:600}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.detail .ph{aspect-ratio:16/9;font-size:72px}
.detail .tx{padding:18px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.bigprice{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.qty output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:12px;padding:13px 18px;font-weight:700;border:1px solid var(--ink);background:transparent}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line .g{flex:1;min-width:0}
.line .g b{display:block}
.line .g span{font-size:13px;color:var(--muted)}
.line .rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.note{border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}
textarea{width:100%;min-height:150px;font:14px/1.4 var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.toast{font-weight:600;color:var(--ok);font-size:14px;min-height:1.4em}
</style>

</div></header>

const PRICES = "0001:200,0002:200,0003:200,0004:220,0005:220,0006:240,0007:240,0008:240,0009:240,0010:240,0011:250";
const ITEMS = [];
const _P = Object.fromEntries(PRICES.split(",").map(x => x.split(":")).map(([k,v]) => [k, Number(v)]));
RAW.split("\n").forEach(l => { const [g,sc,sx,c,sz] = l.split("|"); sz.split(",").forEach((s,i) => { const code = String(Number(c)+i).padStart(4,"0"); ITEMS.push([code,g,s,sc,sx,_P[code] ?? null]); }); });

const SCHOOLS = [['sc','San Calixto'],['cic','Inglés Católico'],['uee','Unidad Educativa del Ejército'],['add','Amor de Dios'],['si','San Ignacio'],['as','American School'],['cds','Colegio del Sur'],['mp','Macario Pinilla'],['sa','Santa Ana'],['idef','IDEF Bancario'],['nav','Naval'],['rg','Rosa Gattorno'],['ls','La Salle'],['mc','Unidad Educativa Medina Celi'],['lp','Los Pinos']];
const SNAME = Object.fromEntries(SCHOOLS);
const GNAME = {V:'Varón', M:'Mujer'};
const NAMES = {PANTALONES:'Pantalón'};
const ACC = new Set(['MEDIAS','PANTY','CORBATA','GORRA','MORRAL','SOMBRERO']);
const ORDER = ['CHOMPA','CAMISA','BLUSA','PANTALONES','FALDA','YAMPER','CHALECO','CORBATA','CHAQUETA','CHAMARRA','CANGURO','BUZO','DEPORTIVO','POLERA','SHORT','CALZA','MEDIAS','PANTY','GORRA','SOMBRERO','MORRAL'];
const SIZE_GROUPS = [
  ['Niño y niña', ['4','6','8','10','12','14','16']],
  ['Juvenil y adulto', ['XS','S','M','L','XL','XXL']],
  ['Cintura (pantalón y falda)', ['34','36','38','40','42','44','46','48','50']],
  ['Cuello de camisa', ['14.5','15','15.5','16.5','17']]
];
const CASUAL = [
  ['Parte de arriba', 'Chaqueta, chamarra, chaleco'],
  ['Interior', 'Polera, polerón, sudadera, camisa o blusa'],
  ['Parte inferior', 'Pantalón']
];

// número de modelo cuando hay varias prendas iguales en la misma talla
const seen = {};
const DB = ITEMS.map(r => { const k = r[3]+'|'+r[1]+'|'+r[4]+'|'+r[2]; seen[k] = (seen[k]||0)+1;
  return {code:r[0], g:r[1], size:r[2], school:r[3], sex:r[4], price:r[5], k, n:seen[k]}; });
const BYCODE = Object.fromEntries(DB.map(i => [i.code, i]));
const COUNT = {}; DB.forEach(i => COUNT[i.school] = (COUNT[i.school]||0)+1);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gname = g => NAMES[g] || g.charAt(0) + g.slice(1).toLowerCase();
const title = i => gname(i.g) + (seen[i.k] > 1 ? ' · modelo ' + i.n : '');
const money = p => 'Bs. ' + p;
const rank = g => { const x = ORDER.indexOf(g); return x < 0 ? 99 : x; };

let S = {view:'home'};
let cart = [];
try { cart = (JSON.parse(localStorage.getItem('su-pedido')) || []).filter(l => BYCODE[l.code]); } catch(e) {}
const save = () => { try { localStorage.setItem('su-pedido', JSON.stringify(cart)); } catch(e) {} };

const pool = () => DB.filter(i => i.school === S.school && (i.sex === S.sex || i.sex === 'U'));
const app = document.getElementById('app');

function go(patch){ S = Object.assign({}, S, patch); render(); window.scrollTo(0,0); }

function trail(){
  const t = [];
  const add = (label, patch) => t.push('<button data-go=\'' + esc(JSON.stringify(patch)) + '\'>' + esc(label) + '</button>');
  if (S.view === 'home') return '';
  if (S.view === 'pay') { return '<nav class="trail"><button class="back" data-go=\'' + esc(JSON.stringify(S.prev || {view:'home'})) + '\'>← Seguir eligiendo</button></nav>'; }
  add('Inicio', {view:'home'});
  if (S.view.startsWith('casual')) { add('Ropa casual', {view:'casual'}); if (S.csex) add(GNAME[S.csex], {view:'casual2'}); }
  else {
    add('Uniformes', {view:'schools'});
    if (S.school && S.view !== 'schools') add(SNAME[S.school], {view:'sex'});
    if (S.sex && ['size','items','item'].includes(S.view)) add(GNAME[S.sex], {view:'size'});
    if (S.size && ['items','item'].includes(S.view)) add(S.size === '*' ? 'Accesorios' : 'Talla ' + S.size, {view:'items'});
  }
  return '<nav class="trail" aria-label="Pasos">' + t.join('') + '</nav>';
}

function card(i){
  return '<button class="card" data-go=\'' + esc(JSON.stringify({view:'item', code:i.code})) + '\'>' +
    '<div class="ph" aria-hidden="true">' + esc(gname(i.g).charAt(0)) + '</div><div class="tx">' +
    '<span class="nm">' + esc(title(i)) + '</span>' +
    (S.size === '*' ? '<span class="mt">Talla ' + esc(i.size) + '</span>' : '') +
    (i.price != null ? '<span class="price">' + money(i.price) + '</span>' : '<span class="noprice">Precio por confirmar</span>') +
    '</div></button>';
}

const VIEWS = {
  home(){
    return '<h1>¿Qué estás buscando?</h1><div class="big">' +
      '<button class="hot" data-go=\'{"view":"schools"}\'><strong>Uniformes escolares</strong><span>Elige el colegio, la talla y la prenda</span></button>' +
      '<button data-go=\'{"view":"casual"}\'><strong>Ropa casual</strong><span>Chamarras, poleras, pantalones</span></button></div>';
  },
  schools(){
    return '<h1>¿De qué colegio?</h1><div class="list">' + SCHOOLS.map(([k,n]) => COUNT[k]
      ? '<button class="row" data-go=\'' + esc(JSON.stringify({view:'sex', school:k, sex:null, size:null})) + '\'>' + esc(n) + '<small>' + COUNT[k] + ' prendas</small></button>'
      : '<button class="row" disabled>' + esc(n) + '<small>Próximamente</small></button>').join('') + '</div>';
  },
  sex(){
    return '<h1>' + esc(SNAME[S.school]) + '</h1><p class="lead">¿Para quién es el uniforme?</p><div class="big">' +
      ['V','M'].map(x => '<button data-go=\'' + esc(JSON.stringify({view:'size', sex:x, size:null})) + '\'><strong>' + GNAME[x] + '</strong></button>').join('') + '</div>';
  },
  size(){
    const p = pool(), main = new Set(p.filter(i => !ACC.has(i.g)).map(i => i.size)), acc = p.filter(i => ACC.has(i.g));
    let h = '<h1>¿Qué talla buscas?</h1>';
    SIZE_GROUPS.forEach(([label, sizes]) => { const have = sizes.filter(s => main.has(s)); if (!have.length) return;
      h += '<div class="group"><h2>' + label + '</h2><div class="sizes">' + have.map(s => '<button data-go=\'' + esc(JSON.stringify({view:'items', size:s})) + '\'>' + esc(s) + '</button>').join('') + '</div></div>'; });
    if (acc.length) { const kinds = [...new Set(acc.map(i => gname(i.g).toLowerCase()))].join(', ');
      h += '<div class="group"><h2>Accesorios</h2><button class="row" data-go=\'{"view":"items","size":"*"}\'>Ver ' + esc(kinds) + '<small>' + acc.length + '</small></button></div>'; }
    return h;
  },
  items(){
    const p = pool().filter(i => S.size === '*' ? ACC.has(i.g) : (!ACC.has(i.g) && i.size === S.size))
      .sort((a,b) => rank(a.g) - rank(b.g) || a.n - b.n || a.code.localeCompare(b.code));
    return '<h1>' + (S.size === '*' ? 'Accesorios' : 'Prendas en talla ' + esc(S.size)) + '</h1><p class="lead">' + esc(SNAME[S.school]) + ' · ' + GNAME[S.sex] + ' · ' + p.length + ' prendas</p>' +
      (p.length ? '<div class="cards">' + p.map(card).join('') + '</div>' : '<div class="empty">No hay prendas en esta talla.</div>');
  },
  item(){
    const i = BYCODE[S.code]; S.q = S.q || 1;
    return '<div class="detail"><div class="ph" aria-hidden="true">' + esc(gname(i.g).charAt(0)) + '</div><div class="tx">' +
      '<h1>' + esc(title(i)) + '</h1>' +
      '<dl class="facts"><dt>Colegio</dt><dd>' + esc(SNAME[i.school]) + '</dd><dt>Talla</dt><dd>' + esc(i.size) + '</dd><dt>Para</dt><dd>' + ({V:'Varón',M:'Mujer',U:'Varón y mujer'}[i.sex]) + '</dd></dl>' +
      (i.price != null ? '<div class="bigprice">' + money(i.price) + '</div>' : '<div class="note">Esta prenda todavía no tiene precio cargado. Puedes agregarla al pedido y te confirmamos el precio.</div>') +
      '<div class="qty"><span>Cantidad</span><button data-q="-1" aria-label="Quitar una">−</button><output id="qty">' + S.q + '</output><button data-q="1" aria-label="Agregar una">+</button></div>' +
      '<div class="actions"><button class="btn primary" data-add="pay">Ir al pago</button><button class="btn" data-add="stay">Agregar y seguir eligiendo</button></div>' +
      '<div class="toast" id="toast" role="status"></div></div></div>';
  },
  casual(){
    return '<h1>Ropa casual</h1><p class="lead">¿Para quién?</p><div class="big">' +
      ['V','M'].map(x => '<button data-go=\'' + esc(JSON.stringify({view:'casual2', csex:x})) + '\'><strong>' + GNAME[x] + '</strong></button>').join('') + '</div>';
  },
  casual2(){
    return '<h1>Ropa casual · ' + GNAME[S.csex] + '</h1><div class="list">' + CASUAL.map(([a,b]) =>
      '<button class="row" disabled><span>' + a + '<br><small style="white-space:normal">' + b + '</small></span><small>Próximamente</small></button>').join('') + '</div>' +
      '<div class="empty">Todavía no hay prendas casuales cargadas en el catálogo.</div>';
  },
  pay(){
    if (!cart.length) return '<h1>Tu pedido</h1><div class="empty">Aún no agregaste prendas.</div><div class="actions"><button class="btn primary" data-go=\'{"view":"home"}\'>Ver el catálogo</button></div>';
    let total = 0, pend = 0, txt = 'Pedido STAND UP\n';
    const rows = cart.map((l, x) => { const i = BYCODE[l.code]; const sub = i.price != null ? i.price * l.q : null;
      if (sub == null) pend++; else total += sub;
      txt += '- ' + l.q + ' x ' + title(i) + ', talla ' + i.size + ', ' + SNAME[i.school] + (sub != null ? ' = Bs. ' + sub : ' = precio por confirmar') + '\n';
      return '<div class="line"><div class="g"><b>' + l.q + ' × ' + esc(title(i)) + '</b><span>' + esc(SNAME[i.school]) + ' · talla ' + esc(i.size) + '</span><br><button class="rm" data-rm="' + x + '">Quitar</button></div>' +
        (sub != null ? '<span class="price">' + money(sub) + '</span>' : '<span class="noprice">Por confirmar</span>') + '</div>'; }).join('');
    txt += 'Total: Bs. ' + total + (pend ? ' + ' + pend + ' prenda(s) con precio por confirmar' : '');
    return '<h1>Tu pedido</h1><div>' + rows + '<div class="total"><span>Total' + (pend ? ' (sin las prendas por confirmar)' : '') + '</span><span class="bigprice">' + money(total) + '</span></div></div>' +
      '<div class="group"><h2>Pago</h2><div class="note">Falta configurar: aquí irá la forma de pago de STAND UP (QR, WhatsApp o pago en tienda).</div>' +
      '<label for="pedido" class="lead">Mientras tanto, copia tu pedido y envíalo a la tienda:</label><textarea id="pedido" readonly>' + esc(txt) + '</textarea>' +
      '<div class="actions"><button class="btn primary" id="copy">Copiar pedido</button><button class="btn" id="clear">Vaciar pedido</button></div><div class="toast" id="toast" role="status"></div></div>';
  }
};

function render(){
  app.innerHTML = trail() + VIEWS[S.view]();
  const n = cart.reduce((a,l) => a + l.q, 0);
  document.getElementById('cartbtn').textContent = 'Mi pedido · ' + n;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.id === 'home') return go({view:'home'});
  if (b.id === 'cartbtn') return go({view:'pay', prev: S.view === 'pay' ? S.prev : Object.assign({}, S, {prev:null})});
  if (b.dataset.go) { const p = JSON.parse(b.dataset.go); if (p.view === 'item') p.q = 1; return go(p); }
  if (b.dataset.q) { S.q = Math.max(1, Math.min(99, S.q + Number(b.dataset.q))); document.getElementById('qty').textContent = S.q; return; }
  if (b.dataset.add) {
    const l = cart.find(l => l.code === S.code); if (l) l.q += S.q; else cart.push({code:S.code, q:S.q}); save();
    if (b.dataset.add === 'pay') return go({view:'pay', prev:Object.assign({}, S, {view:'items', prev:null})});
    render(); document.getElementById('toast').textContent = 'Agregado a tu pedido.'; return;
  }
  if (b.dataset.rm) { cart.splice(Number(b.dataset.rm), 1); save(); return render(); }
  if (b.id === 'clear') { cart = []; save(); return render(); }
  if (b.id === 'copy') {
    const ta = document.getElementById('pedido'), t = document.getElementById('toast');
    const fb = () => { ta.focus(); ta.select(); t.textContent = 'Texto seleccionado: mantén presionado y elige Copiar.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => { t.textContent = 'Pedido copiado.'; }, fb); else fb();
  }
});
render();
</script>
